services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogo-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: docker
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      LOG_STACK: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: catalogo
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - catalogo

  nginx:
    image: nginx:alpine
    container_name: catalogo-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - catalogo

  frontend:
    image: nginx:alpine
    container_name: catalogo-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx
    networks:
      - catalogo

  mysql:
    image: mysql:8.0
    container_name: catalogo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: catalogo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - catalogo

volumes:
  mysql_data:

networks:
  catalogo:
    driver: bridge
